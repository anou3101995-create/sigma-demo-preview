<section id="sigma-demo-settings" hidden aria-label="Demo payment settings">
  <h2>ຕັ້ງຄ່າຂໍ້ມູນຮັບເງິນ</h2>
  <p><strong>DEMO ONLY:</strong> ຂໍ້ມູນນີ້ບັນທຶກຢູ່ໃນ browser/localStorage ເທົ່ານັ້ນ. ບໍ່ມີການເຊື່ອມທະນາຄານ ຫຼືຮັບ payment ຈິງ.</p>
  <div id="sigma-demo-payment"><strong>ຂໍ້ຄວາມ Contact Admin</strong><span id="sigma-demo-message-preview"></span></div>
  <label for="sigma-company-phone">ໂທຕິດຕໍ່ບໍລິສັດ</label>
  <input id="sigma-company-phone" inputmode="tel" placeholder="ເຊັ່ນ 020 xxxx xxxx" />
  <label for="sigma-whatsapp">WhatsApp Contact Admin (ຮູບແບບສາກົນ)</label>
  <input id="sigma-whatsapp" inputmode="tel" placeholder="ເຊັ່ນ 85620xxxxxxx" />
  <label for="sigma-bank-name">ຊື່ທະນາຄານ</label>
  <input id="sigma-bank-name" placeholder="ຍັງບໍ່ໄດ້ຕັ້ງຄ່າ" />
  <label for="sigma-account-name">ຊື່ບັນຊີ</label>
  <input id="sigma-account-name" placeholder="ຍັງບໍ່ໄດ້ຕັ້ງຄ່າ" />
  <label for="sigma-account-number">ເລກບັນຊີ</label>
  <input id="sigma-account-number" placeholder="ຍັງບໍ່ໄດ້ຕັ້ງຄ່າ" />
  <label for="sigma-payment-message">ຂໍ້ຄວາມ Contact Admin</label>
  <textarea id="sigma-payment-message">ສະບາຍດີ ຫາກທ່ານມີຄຳຖາມ ສາມາດຕິດຕໍ່ຜູ້ດູແລລະບົບໄດ້ເລີຍ.</textarea>
  <div class="actions"><button type="button" class="save" id="sigma-demo-settings-save">ບັນທຶກໃນ Demo</button><button type="button" class="close" id="sigma-demo-settings-close">ປິດ</button></div>
</section>
<script>
(()=>{
  const key='sigma_demo_payment_settings';
  const defaults={companyPhone:'',whatsapp:'',bankName:'',accountName:'',accountNumber:'',message:'ສະບາຍດີ ຫາກທ່ານມີຄຳຖາມ ສາມາດຕິດຕໍ່ຜູ້ດູແລລະບົບໄດ້ເລີຍ.'};
  const get=()=>{try{return {...defaults,...JSON.parse(localStorage.getItem(key)||'{}')}}catch{return {...defaults}}};
  const $=id=>document.getElementById(id); const fields=['companyPhone','whatsapp','bankName','accountName','accountNumber','message'];
  const load=()=>{const s=get();fields.forEach(k=>{const el=$('sigma-'+(k==='message'?'payment-message':k));if(el)el.value=s[k]||''});$('sigma-demo-message-preview').textContent=s.message};
  const save=()=>{const s={};fields.forEach(k=>{const el=$('sigma-'+(k==='message'?'payment-message':k));s[k]=(el.value||'').trim()});localStorage.setItem(key,JSON.stringify(s));$('sigma-demo-message-preview').textContent=s.message;alert('ບັນທຶກໄວ້ໃນ browser demo ແລ້ວ');};
  $('sigma-demo-settings-open').onclick=()=>{$('sigma-demo-settings').hidden=false;load()}; $('sigma-demo-settings-close').onclick=()=>{$('sigma-demo-settings').hidden=true}; $('sigma-demo-settings-save').onclick=save;
  $('sigma-demo-contact-admin').onclick=()=>{const s=get(); const n=(s.whatsapp||'').replace(/\D/g,''); if(!n){$('sigma-demo-settings').hidden=false;load();alert('ກະລຸນາໃສ່ເບີ WhatsApp Contact Admin ກ່ອນ');return} const text=encodeURIComponent(s.message||defaults.message); window.open('https://wa.me/'+n+'?text='+text,'_blank','noopener,noreferrer');};
  load();
})();
</script>
